name: Release

# Builds the addon zip and uploads it to CurseForge whenever a version tag is
# pushed. Tag the commit you want released:
#
#     git tag v0.0.9
#     git push origin v0.0.9
#
# Requires one repository secret, CF_API_KEY, from the CurseForge account
# settings under API Tokens. The .toc also needs its X-Curse-Project-ID line,
# which CurseForge only issues once the project exists — without it the
# packager builds the zip and has nowhere to send it.
#
# Nothing here uploads on an ordinary push. Only tags.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    # The packager creates a GitHub release once the CurseForge upload has
    # gone through, and GITHUB_TOKEN is read-only by default on new
    # repositories. Without this the upload succeeds and the job then fails
    # at the very last step with a 403, which reads as "the release failed"
    # when the addon has in fact already shipped.
    #
    # Granted here rather than by flipping the repository-wide setting to
    # read and write, so the permission is visible in the file that needs it
    # and does not silently apply to every other workflow added later.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads the commit history to build the changelog, so
          # a shallow clone gives it nothing to work with.
          fetch-depth: 0

      - name: Check the Lua before shipping it
        run: python tools/syl_check.py

      # The test suites, all of which run the shipped Lua rather than a copy
      # of it: every file in the .toc parses and then loads against a stubbed
      # client, the migrations do the right thing to every state an install
      # can be in, and a drought is only reset by content that counts as a
      # raid night.
      #
      # lupa ships manylinux wheels, so this is a download rather than a
      # build. If it ever starts costing releases, drop both steps — the
      # tests still run locally.
      - name: Run the tests
        run: |
          python -m pip install --quiet lupa
          for suite in tools/test_*.py; do
            echo "--- $suite"
            python "$suite" || exit 1
          done

      - name: Package and upload
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
